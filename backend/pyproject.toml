[project]
name = "swasthyagrid-backend"
version = "0.1.0"
description = "SwasthyaGrid AI — District Health Operations Center backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.16",
    "tenacity>=8.0",
    "httpx>=0.24",
    "websockets>=13.0",
    "sse-starlette>=3,<4",
    "rapidfuzz>=3.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
