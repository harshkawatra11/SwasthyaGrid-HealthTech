# Voice agent accuracy eval cases (plan 7.10, B9).
#
# Each case is one typed turn sent to a real VoiceSession (real Sarvam chat,
# real district/forecast/recommendation/logistics/insights services). The
# runner never hard-codes an expected answer: ground truth for the "grounded"
# check is computed live, at run time, by calling the same tool function with
# the arguments the model actually chose.
#
# Fields:
#   id       unique case id
#   text     the user's typed message (English or Hindi)
#   tool     expected tool name, or null for a question that needs no tool
#   entity   optional {kind: district|facility, id: <seed id>} the model's
#            chosen argument must resolve to (checked with the same
#            resolvers the tools use, app.tools.resolve)
#   args     optional {key: [acceptable, values, ...]} the model's tool
#            arguments are checked against (case-insensitive substring)
#   checks   which checks to run: tool, entity, grounded, no_tool, ambiguous,
#            soft_entity (entity check that tolerates "no active shipment"
#            style live-state misses), args
#   note     why the case exists, for humans reading a failure list

- id: state_01
  text: "Give me the state-wide overview across all five districts."
  tool: get_state_briefing
  checks: [tool, grounded]
  note: "state-wide summary tool"

- id: district_01
  text: "Give me the Kota district briefing."
  tool: get_district_briefing
  entity: {kind: district, id: district_kota}
  checks: [tool, entity, grounded]

